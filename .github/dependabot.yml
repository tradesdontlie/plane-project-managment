version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directories:
      - "/apps/admin"
      - "/apps/api"
      - "/apps/live"
      - "/apps/proxy"
      - "/apps/space"
      - "/apps/web"
      - "/deployments/aio/community"
    schedule:
      interval: "weekly"
